<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBusLive - Mapa en Tiempo Real</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* CSS ÚNICO Y LIMPIO */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        .map-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(14, 22, 35, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: #fff;
            width: 320px;
            max-width: calc(100vw - 40px);
        }

        h2 { font-size: 18px; margin-bottom: 5px; }
        p { font-size: 13px; color: rgba(232, 237, 245, 0.7); margin-bottom: 15px; }

        .btn-volver {
            display: block;
            width: 100%;
            background: #f5a623;
            color: #000;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            text-align: center;
            margin-top: 10px;
        }

        .custom-bus-icon { transition: transform 0.4s linear; }
        .bus-premium {
            width: 40px; height: 18px; background: #f5a623;
            border-radius: 4px 10px 4px 4px; position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); border: 1px solid #ffffff;
        }
        .bus-premium::before { content: ''; position: absolute; top: 0; right: 2px; width: 8px; height: 100%; background: #080d16; border-radius: 0 7px 2px 0; }
        .bus-premium-windows { position: absolute; top: 3px; left: 4px; width: 22px; height: 4px; display: flex; gap: 2px; }
        .window { width: 4px; height: 100%; background: rgba(255, 255, 255, 0.7); border-radius: 1px; }
        .bus-premium::after { content: ''; position: absolute; top: 2px; left: -1px; width: 2px; height: 12px; background: #ff3b30; border-radius: 2px 0 0 2px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="map-overlay">
        <h2>Panel de Control</h2>
        <p>Monitoreando rutas activas en tiempo real.</p>
        <a href="index.html" class="btn-volver">← Volver al Inicio</a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([11.2404, -74.1990], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const rutaCoordenadas = [[11.2404, -74.1990], [11.2435, -74.1950], [11.2470, -74.1910], [11.2510, -74.1880], [11.2550, -74.1900], [11.2580, -74.1950], [11.2540, -74.2010], [11.2460, -74.2050], [11.2404, -74.1990]];
        L.polyline(rutaCoordenadas, { color: '#f5a623', weight: 5, opacity: 0.75 }).addTo(map);

        const busHtml = `<div class="bus-premium"><div class="bus-premium-windows"><div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div></div></div>`;
        const busIcon = L.divIcon({ html: busHtml, className: 'custom-bus-icon', iconSize: [40, 18], iconAnchor: [20, 9] });
        const busMarker = L.marker(rutaCoordenadas[0], { icon: busIcon }).addTo(map);

        let currentIndex = 0;
        function simularMovimientoFluido() {
            const siguienteIndex = (currentIndex + 1) % rutaCoordenadas.length;
            busMarker.setLatLng(rutaCoordenadas[siguienteIndex]);
            currentIndex = siguienteIndex;
            setTimeout(simularMovimientoFluido, 2000);
        }
        simularMovimientoFluido();
    </script>
</body>
</html>
