<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style> #map { height: 100vh; } </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([4.4389, -75.2322], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var marker = L.marker([4.4389, -75.2322]).addTo(map);

        async function conectar() {
            // SOLO CAMBIA ESTO:
            const usuario = 'spneider30@gmail.com'; 
            const pass = '1004355474ns';
            
            const resp = await fetch('https://demo.traccar.org/api/positions', {
                headers: { 'Authorization': 'Basic ' + btoa(usuario + ':' + pass) }
            });
            const datos = await resp.json();
            const bus = datos.find(p => p.deviceId == 67942232);

            if (bus) {
                marker.setLatLng([bus.latitude, bus.longitude]);
                map.setView([bus.latitude, bus.longitude], 15);
            }
        }
        setInterval(conectar, 5000);
        conectar();
    </script>
</body>
</html>
