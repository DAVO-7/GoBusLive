<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBusLive - Sistema de Monitoreo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* --- ESTILOS GENERALES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f4f6f9;
            overflow: hidden;
        }
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- INTERFAZ FLOTANTE LIMPIA --- */
        .map-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(14, 22, 35, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: #fff;
        }
        h2 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 5px;
        }
        p {
            font-size: 13px;
            color: rgba(232, 237, 245, 0.7);
            margin-bottom: 15px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 15px;
            background: #f5a623;
            color: #000;
        }
        .btn-volver {
            display: inline-block;
            background: #f5a623;
            color: #000;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: opacity 0.2s;
        }
        .btn-volver:hover {
            opacity: 0.85;
        }

        /* --- DISEÑO DE BUS PREMIUM --- */
        .custom-bus-icon {
            transition: transform 0.4s linear;
        }
        .bus-premium {
            width: 40px;
            height: 18px;
            background: #f5a623;
            border-radius: 4px 10px 4px 4px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid #ffffff;
        }
        .bus-premium::before {
            content: '';
            position: absolute;
            top: 0;
            right: 2px;
            width: 8px;
            height: 100%;
            background: #080d16;
            border-radius: 0 7px 2px 0;
        }
        .bus-premium-windows {
            position: absolute;
            top: 3px;
            left: 4px;
            width: 22px;
            height: 4px;
            display: flex;
            gap: 2px;
        }
        .window {
            width: 4px;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 1px;
        }
        .bus-premium::after {
            content: '';
            position: absolute;
            top: 2px;
            left: -1px;
            width: 2px;
            height: 12px;
            background: #ff3b30;
            border-radius: 2px 0 0 2px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="map-overlay">
        <h2>Monitoreo en Vivo</h2>
        <p>Plataforma de rastreo NAVIUZ.</p>
        <div id="modo-estado" class="status-badge">MODO: DEMOSTRACIÓN</div>
        <br>
        <a href="index.html" class="btn-volver">← Volver al Inicio</a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- CONFIGURACIÓN DE PRODUCCIÓN ---
        const USAR_DATOS_REALES_GPS = false; 
        const URL_API_EMPRESA = "https://api.naviuz.com/v1/gobuslive/buses";

        // 1. Inicializar Mapa centrado en la ruta
        const map = L.map('map').setView([11.1350, -74.2250], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Coordenadas del viaje de simulación (Santa Marta - Ciénaga)
        const rutaSimulada = [[11.2404, -74.1990],[11.2010, -74.2180],[11.1350, -74.2250],[11.0110, -74.2500],[11.0110, -74.2500],[11.1350, -74.2250],[11.2010, -74.2180],[11.2404, -74.1990]];

        // CREAMOS LA LÍNEA DEL RASTRO (Empieza vacía)
        const lineaRastro = L.polyline([], { color: '#f5a623', weight: 5, opacity: 0.85 }).addTo(map);

        // Icono Premium
        const busHtml = `<div class="bus-premium"><div class="bus-premium-windows"><div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div></div></div>`;
        const busIcon = L.divIcon({ html: busHtml, className: 'custom-bus-icon', iconSize: [40, 18], iconAnchor: [20, 9] });
        const busMarker = L.marker(rutaSimulada[0], { icon: busIcon }).addTo(map);

        // --- MOTOR DE DECISIÓN ---
        if (USAR_DATOS_REALES_GPS) {
            document.getElementById("modo-estado").innerText = "MODO: SATELITAL EN VIVO";
            document.getElementById("modo-estado").style.background = "#4CAF50";
            document.getElementById("modo-estado").style.color = "#fff";
            
            conectarServidorGpsReal();
            setInterval(conectarServidorGpsReal, 4000);
        } else {
            iniciarSimulacionDemo();
        }

        // --- SISTEMA SATELITAL FUTURO ---
        async function conectarServidorGpsReal() {
            try {
                const respuesta = await fetch(URL_API_EMPRESA);
                const datos = await respuesta.json();
                
                const nuevaLat = datos.lat;
                const nuevaLon = datos.lon;
                const rumboGrados = datos.rumbo - 90;

                const nuevaPosicion = [nuevaLat, nuevaLon];
                busMarker.setLatLng(nuevaPosicion);
                
                // Agrega el nuevo punto al rastro real del GPS
                lineaRastro.addLatLng(nuevaPosicion);

                const iconoElemento = busMarker.getElement();
                if (iconoElemento) {
                    iconoElemento.style.transform = `${iconoElemento.style.transform.split('rotate')[0]} rotate(${rumboGrados}deg)`;
                }
            } catch (error) {
                console.log("Esperando flujo de datos...");
            }
        }

        // --- SISTEMA DE SIMULACIÓN CON EFECTO RASTRO ---
        let currentIndex = 0;
        const pasosPorTramo = 80;

        function calcularAngulo(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180; const lat2Rad = lat2 * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function iniciarSimulacionDemo() {
            const puntoActual = rutaSimulada[currentIndex];
            const siguienteIndex = (currentIndex + 1) % rutaSimulada.length;
            const siguientePunto = rutaSimulada[siguienteIndex];
            const anguloCorregido = calcularAngulo(puntoActual[0], puntoActual[1], siguientePunto[0], siguientePunto[1]) - 90;
            let pasoActual = 0;

            // Si vuelve a empezar el circuito, limpiamos el rastro viejo para que vuelva a dibujar de cero
            if(currentIndex === 0) {
                lineaRastro.setLatLngs([]);
            }

            function avanzarPaso() {
                if (pasoActual <= pasosPorTramo) {
                    const fraccion = pasoActual / pasosPorTramo;
                    const nuevaLat = puntoActual[0] + (siguientePunto[0] - puntoActual[0]) * fraccion;
                    const nuevaLng = puntoActual[1] + (siguientePunto[1] - puntoActual[1]) * fraccion;
                    
                    const coordenadaIntermedia = [nuevaLat, nuevaLng];
                    
                    // Movemos el bus
                    busMarker.setLatLng(coordenadaIntermedia);
                    
                    // DIBUJA LA LÍNEA SOLO POR DONDE PASA EL BUS
                    lineaRastro.addLatLng(coordenadaIntermedia);

                    const iconoElemento = busMarker.getElement();
                    if (iconoElemento) {
                        iconoElemento.style.transform = `${iconoElemento.style.transform.split('rotate')[0]} rotate(${anguloCorregido}deg)`;
                    }
                    pasoActual++;
                    setTimeout(avanzarPaso, 30);
                } else {
                    currentIndex = siguienteIndex;
                    setTimeout(iniciarSimulacionDemo, 1500);
                }
            }
            avanzarPaso();
        }
    </script>
</body>
</html>
