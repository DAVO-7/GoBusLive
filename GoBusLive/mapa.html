<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBusLive</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .map-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(14, 22, 35, 0.95);
            padding: 20px; border-radius: 12px; color: #fff;
            width: 300px; max-width: 90vw;
        }
        .btn-volver {
            display: block; width: 100%; background: #f5a623; color: #000;
            padding: 10px; text-align: center; text-decoration: none;
            border-radius: 8px; margin-top: 10px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="map-overlay">
        <h2>Panel de Control</h2>
        <p>Monitoreando rutas.</p>
        <a href="index.html" class="btn-volver">Volver al Inicio</a>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([11.2404, -74.1990], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
    </script>
</body>
</html>
