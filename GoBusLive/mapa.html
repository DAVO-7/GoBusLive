<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GoBusLive - Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
        .controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: #0f172a; padding: 10px; border-radius: 10px; display: flex; gap: 5px; }
        input { background: transparent; border: none; color: white; padding: 5px; width: 100px; }
        button { background: #f5a623; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <a href="index.html" style="color:white; text-decoration:none; padding:5px;">← Volver</a>
        <input type="text" id="busId" placeholder="ID (ej: 58661)">
        <button onclick="buscarBus()">Buscar</button>
    </div>

    <script>
        const map = L.map('map').setView([4.4389, -75.2322], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const marker = L.marker([4.4389, -75.2322]).addTo(map);

        async function buscarBus() {
            const id = document.getElementById('busId').value;
            // Conectamos directamente a tu servidor en Railway para mayor estabilidad
            const url = 'https://gobuslive-production.up.railway.app/posiciones';

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Buscamos el ID en los datos que devuelve tu servidor
                const bus = data[id];

                if (bus) {
                    marker.setLatLng([bus.lat, bus.lon]);
                    map.setView([bus.lat, bus.lon], 15);
                } else {
                    alert("Bus no encontrado. Verifica el ID.");
                }
            } catch (error) {
                console.error("Error al obtener datos:", error);
                alert("Error de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>
