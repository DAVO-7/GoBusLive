<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBusLive — Rastrea tu bus en tiempo real</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #080d16; --bg2: #0e1623; --accent: #f5a623; --text: #e8edf5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

        /* Navegación simplificada: Solo logo y botón */
        nav {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(8,13,22,0.92);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 100;
        }
        .nav-logo { font-family: 'Space Mono', monospace; font-size: 17px; font-weight: 700; color: #fff; text-decoration: none; }
        .nav-logo span { color: var(--accent); }
        .nav-btn {
            background: var(--accent); color: #000; font-size: 13px; font-weight: 700;
            padding: 8px 18px; border-radius: 7px; text-decoration: none;
        }

        /* Hero ajustado para no solaparse */
        #hero {
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 80px 24px 60px;
            background-image: linear-gradient(rgba(8, 13, 22, 0.65), rgba(8, 13, 22, 0.85)), url('bus.png');
            background-size: cover; background-position: center;
        }
        h1 { font-size: clamp(36px, 6vw, 68px); font-weight: 700; line-height: 1.1; margin-bottom: 20px; }
        h1 span { color: var(--accent); }
        .hero-sub { font-size: clamp(15px, 2vw, 19px); color: #fff; opacity: 0.9; margin-bottom: 30px; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="nav-logo">Go<span>Bus</span>Live</a>
    <a href="mapa.html" class="nav-btn">🗺 Ver mapa</a>
</nav>

<section id="hero">
    <h1>Sabe exactamente<br>dónde va tu <span>bus</span></h1>
    <p class="hero-sub">Rastrea cualquier Bus en tiempo real.</p>
</section>

</body>
</html>
